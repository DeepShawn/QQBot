org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
android.suppressUnsupportedCompileSdk=37
# 只有在 arm64 Linux（比如手机 proot）上构建时需要：Google 的 aapt2 只有 x86_64 版
# android.aapt2FromMavenOverride=/opt/aapt2-arm64/bin/aapt2
